name: Build release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host unit tests
        run: make -C tests run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release with the PSP SDK
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src ticky/pspdev make release
      - name: Build TempAR test application
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src ticky/pspdev make test-app
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: tempar-release
          path: |
            build/*.tar.gz
            build/tempar-test/EBOOT.PBP

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: tempar-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "TempAR ${GITHUB_REF_NAME#v}"
          --generate-notes
          release/tempar-*.tar.gz
          release/EBOOT.PBP#tempar-test-EBOOT.PBP
